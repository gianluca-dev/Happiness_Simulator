<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/happiness_simulator/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/simulator-styles.css">
    <title>Happiness Simulator - Simulator</title>
</head>
<body>
    <header>
        <div class="sim-logo-container">
            <a href="index.html"><img src="assets/happiness_simulator/happiness_simulator_dark.svg" loading="eager" alt="happiness-simulator-logo"></a>
        </div>
        <!--Toast-Notification-->
        <div class="toast-container" id="toast-container"></div>
        <!--Date-Container-->
        <div class="date-container">
            <p id="date-element">00.00.0000</p>
        </div>
    </header>
    <!--Aspect-menu-Navigation-->
    <aside class="aspect-menu-nav" id="aspect-menu-nav">
        <div class="aspect-container-wrapper">
            <!--Aspect-Container-Economic-->
            <div class="aspect-wrapper">
                <div class="aspect-container" id="economic">
                    <img src="assets/simulator_icons/coins.svg" loading="eager" alt="aspect-icon">
                </div>
            </div>
            <!--Aspect-Container-Political-->
            <div class="aspect-wrapper">
                <div class="aspect-container" id="political">
                    <img src="assets/simulator_icons/political.svg" loading="eager" alt="aspect-icon">
                </div>
            </div>
            <!--Aspect-Container-Social-->
            <div class="aspect-wrapper">
                <div class="aspect-container" id="social">
                    <img src="assets/simulator_icons/social.svg" loading="eager" alt="aspect-icon">
                </div>
            </div>
            <!--Aspect-Container-Health-->
            <div class="aspect-wrapper">
                <div class="aspect-container" id="health">
                    <img src="assets/simulator_icons/health.svg" loading="eager" alt="aspect-icon">
                </div>
            </div>
        </div>
        <!--Aspect-Menu-Section-->
        <section class="aspect-menu-section">
            <!--Aspect-Menu-Economic-->
            <div class="aspect-menu" id="aspect-menu-economic">
                <p class="aspect-menu-title">Ökonomische Ereignisse</p>
                <div class="event-container" id="event-container-economic"></div>
            </div>
            <!--Aspect-Menu-Political-->
            <div class="aspect-menu" id="aspect-menu-political">
                <p class="aspect-menu-title">Politische Ereignisse</p>
                <div class="event-container" id="event-container-political"></div>
            </div>
            <!--Aspect-Menu-Social-->
            <div class="aspect-menu" id="aspect-menu-social">
                <p class="aspect-menu-title">Soziale Ereignisse</p>
                <div class="event-container" id="event-container-social"></div>
            </div>
            <!--Aspect-Menu-Health-->
            <div class="aspect-menu" id="aspect-menu-health">
                <p class="aspect-menu-title">Gesundheitliche Ereignisse</p>
                <div class="event-container" id="event-container-health"></div>
            </div>
        </section>
    </aside>
    <main>
        <!--Coin-Container-->
        <div class="coin-wrapper">
            <div class="coin-container">
                <p id="coin-element">0.00 €</p>
            </div>
        </div>
        <section class="content-section"></section>
        <!--Life-Evaluation-Section-->
        <section class="life-eval-section">
            <div class="life-eval-chart-container">
                <canvas class="life-eval-chart-canvas" id="life-eval-chart-canvas">
                    <p>Browser unterstützt kein Canvas!</p>
                </canvas>
            </div>
        </section>
        <!--Life-Evaluation-Statistics-Section-->
        <section class="life-eval-stats-section"></section>
        <!--Mails-Section-->
        <section class="app-mails-section inactive" id="app-mails-section">
            <header class="mails-header">
                <p>Emails</p>
                <!--Mail-Search-->
                <div class="mail-search-container">
                    <i class="mail-search-icon">
                        <img src="assets/simulator_icons/search.svg" loading="eager" alt="search-icon">
                    </i>
                    <input type="text" class="mail-search-input" placeholder="Suche...">
                </div>
                <!--Mail-Exit-->
                <div class="exit-container" id="app-mails-exit">
                    <img src="assets/simulator_icons/exit.svg" loading="eager" alt="exit-icon">
                </div>
            </header>
            <aside class="mail-nav">
                <!--Mail-Nav-Start-->
                <div class="mail-nav-start">
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/inbox.svg" loading="eager" alt="inbox-icon">
                    </div>
                    <div class="line"></div>
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/paper-plane.svg" loading="eager" alt="paper-plane-icon">
                    </div>
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/pencil-line.svg" loading="eager" alt="pencil-line-icon">
                    </div>
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/warning.svg" loading="eager" alt="warning-icon">
                    </div>
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/trash.svg" loading="eager" alt="trash-icon">
                    </div>
                </div>
                <!--Mail-Nav-End-->
                <div class="mail-nav-end">
                    <div class="mail-nav-option">
                        <img src="assets/simulator_icons/gear.svg" loading="eager" alt="gear-icon">
                    </div>
                </div>
            </aside>
            <main class="mails-main">
                <!--Mails-Collection-Section-->
                <section class="mails-collection-section" id="mails-collection-section">
                    <div class="mails-collection-container" id="mails-collection-container"></div>
                </section>
                <!--Mails-Section-->
                <section class="mails-section inactive" id="mails-section">
                    <div class="mails-container" id="mails-container"></div>
                </section>
            </main>
        </section>
        <!--Nation-Comparison-Section-->
        <section class="app-nation-comp-section inactive" id="app-nation-comp-section">
            <header class="nation-comp-header">
                <p>Nationenvergleich</p>
                <!--Nation-Comparison-Exit-->
                <div class="exit-container" id="app-nation-comp-exit">
                    <img src="assets/simulator_icons/exit.svg" loading="eager" alt="exit-icon">
                </div>
            </header>
            <div class="nation-comp-chart-container">
                <canvas class="nation-comp-chart-canvas" id="nation-comp-chart-canvas">
                    <p>Browser unterstützt kein Canvas!</p>
                </canvas>
            </div>
        </section>
    </main>
    <footer>
        <nav class="app-icon-navigation">
            <!--App-Icon-Mails-->
            <div class="footer-app-icon-wrapper">
                <div class="mail-notification inactive" id="mail-notification"></div>
                <div class="footer-app-icon" id="app-icon-mails">
                    <img src="assets/simulator_icons/envelope.svg" loading="eager" alt="mail-icon">
                </div>
            </div>
            <!--App-Icon-Nation-Comparison-->
            <div class="footer-app-icon" id="app-icon-nation-comp">
                <img src="assets/simulator_icons/globe.svg" loading="eager" alt="globe-icon">
            </div>
            <!--App-Icon-Tips-->
            <div class="footer-app-icon" id="app-icon-tips">
                <img src="assets/simulator_icons/info.svg" loading="eager" alt="info-icon">
            </div>
        </nav>
    </footer>
</body>
    <script type="module" src="scripts/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</html>
